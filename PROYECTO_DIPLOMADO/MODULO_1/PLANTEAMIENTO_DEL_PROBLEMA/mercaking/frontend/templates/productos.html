{% extends "base.html" %}
{% block title %}Productos{% endblock %}
{% block content %}
<section class="card">
  <h2>Catálogo de productos</h2>
  <div class="toolbar">
    <input id="tenantId" placeholder="Tenant ID" value="a0000000-0000-0000-0000-000000000001" />
    <input id="search" placeholder="Buscar por nombre, código o SKU" />
    <button class="btn primary" onclick="loadProducts()">Buscar</button>
  </div>
  <table class="table" id="prodTable">
    <thead><tr><th>Nombre</th><th>Código</th><th>SKU</th><th>Precio venta</th><th>Stock</th><th>Mín.</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
<script>
const API = "{{ api }}";
async function loadProducts() {
  const tenant = document.getElementById('tenantId').value;
  const q = document.getElementById('search').value;
  const url = `${API}/api/products/?tenant_id=${tenant}${q ? '&q=' + encodeURIComponent(q) : ''}`;
  const res = await fetch(url);
  const data = await res.json();
  const tbody = document.querySelector('#prodTable tbody');
  tbody.innerHTML = '';
  data.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.name}</td><td>${p.barcode || ''}</td><td>${p.sku || ''}</td><td>${p.sale_price}</td><td>${p.current_stock}</td><td>${p.min_stock}</td>`;
    tbody.appendChild(tr);
  });
}
loadProducts();
</script>
{% endblock %}
