{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Iniciar sesión — {{ brand }}</h1>
  <form method="post" action="/login">
    <label>Correo</label>
    <input type="email" name="email" placeholder="admin@mitienda.com" required />
    <label>Contraseña</label>
    <input type="password" name="password" required />
    <button type="submit" class="btn primary">Entrar</button>
  </form>
</section>
{% endblock %}
